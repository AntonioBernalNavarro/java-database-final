# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
spring.application.name=java-database-final

# ============================================
# DATABASE HOST (SINGLE LINE TO MODIFY)
# ============================================
# Option 1 - Remote server (WSL2 at 192.168.0.10):
db.host=${DB_HOST:192.168.0.10}

# Option 2 - Local machine (Docker Desktop on the development PC):
# db.host=${DB_HOST:localhost}

# ============================================
# MySQL - Relational Database
# ============================================
spring.datasource.url=jdbc:mysql://${db.host}:3306/store_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=TuPasswordSegura123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
# The dialect is auto-detected by Hibernate 6.x and must not be specified explicitly.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# MongoDB - Document-Oriented Database
# ============================================
spring.data.mongodb.uri=mongodb://root:TuMongoPassword123@${db.host}:27017/store_reviews?authSource=admin
spring.data.mongodb.auto-index-creation=true

# ============================================
# ACTUATOR - Health and Monitoring Endpoints
# ============================================
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.endpoints.web.exposure.include=health,info

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# ============================================
# ERROR HANDLING (development only)
# ============================================
server.error.include-message=always
